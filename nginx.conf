# SPA fallback for the boasvindas.online static site.
#
# Baked into the frontend image by the root Dockerfile as
# /etc/nginx/conf.d/default.conf. Also usable as-is by any other deploy that
# serves /dist directly (a VPS vhost, a debug run, or Coolify's Static Site).

server {
    listen 80;
    # Only this site lives in the container; Nginx Proxy Manager owns the
    # domain routing and forwards every request here.
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TLS and HSTS terminate at Nginx Proxy Manager, not here.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite emits content-hashed filenames, so assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy keeps serving stale asset refs.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: /login, /app/:id/edit and /:slug are resolved by React
    # Router, so every unknown path returns the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
