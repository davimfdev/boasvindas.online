# SPA fallback for the boasvindas.online static site.
#
# Coolify's "Static Site" build type serves /dist with its own nginx and already
# applies this fallback. Keep this file as the reference for any deploy that
# serves /dist directly (a plain nginx container, a VPS vhost, or a debug run).

server {
    listen 80;
    server_name boasvindas.online www.boasvindas.online;

    root /usr/share/nginx/html;
    index index.html;

    # TLS and HSTS terminate at Nginx Proxy Manager, not here.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite emits content-hashed filenames, so assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy keeps serving stale asset refs.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: /login, /app/:id/edit and /:slug are resolved by React
    # Router, so every unknown path returns the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
