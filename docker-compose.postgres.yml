# Optional Postgres, for an environment that does not have one yet (local dev or
# a fresh VPS). The production VPS ALREADY runs `app-postgres` — do not deploy
# this there, or you get a second, empty database.
#
# The API reaches it by container name on the shared Docker network, so no
# container IP is ever hardcoded:
#   DATABASE_URL=postgresql://boasvindas:SENHA@app-postgres:5432/boasvindas
#
# The name is `app-postgres`, never `postgres`: that hostname collides with
# Coolify's own internal database.
#
# This file does NOT migrate any data. See docs/VPS_MIGRATION.md for the
# Neon -> VPS dump/restore steps.

services:
  postgres:
    image: postgres:17-alpine
    container_name: app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boasvindas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-boasvindas}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # No ports mapping: the database stays reachable only inside the Docker
    # network, never exposed to the internet.
    networks:
      - boasvindas
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-boasvindas} -d ${POSTGRES_DB:-boasvindas}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

networks:
  boasvindas:
    name: boasvindas
    external: true
