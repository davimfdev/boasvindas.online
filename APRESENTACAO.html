# Produto Inicial — boasvindas.online

> Pai, esse documento mostra o que vou entregar nas primeiras 16 horas de trabalho — o produto inicial funcionando. O produto completo está na aba **Roadmap Completo**.

---

## O que você vai receber

Ao final das 16h, o site estará no ar com:

| Funcionalidade | |
|---------------|--|
| URL pública funcionando (`boasvindas.online`) | ✅ |
| Cadastro e login de anfitriões | ✅ |
| Criar página com título, endereço e WhatsApp | ✅ |
| Escolher entre 2 temas (Modern + Rustic) | ✅ |
| Guia do hóspede acessível em `boasvindas.online/nomedoapartamento` | ✅ |
| Seções fixas: boas-vindas, apartamento, check-in, regras, guia local, check-out, emergência | ✅ |
| QR Code para o link da página | ✅ |
| Botão WhatsApp flutuante | ✅ |
| Design responsivo — funciona no celular e no computador | ✅ |

### O que **não** entra ainda (produto completo)
- Editor visual para arrastar e soltar seções
- Upload de fotos diretamente na plataforma
- Personalização de fontes, cores e botões
- Todos os 7 temas
- Analytics, exportação PDF, domínio personalizado
- Colaboração, multi-idioma, biblioteca de templates

---

## Como vão ser as 16 horas

### Bloco 1 — Fundação (4h)

**1ª hora — Base do site**
- Criar o projeto com todas as tecnologias
- Conectar ao servidor (Netlify)
- Site no ar com URL pública funcionando

**2ª hora — Banco de Dados**
- Criar o banco de dados
- Configurar a estrutura para usuários e páginas

**3ª e 4ª hora — Login e Cadastro**
- Sistema de login com email e senha
- Área protegida do anfitrião
- Redirecionamento após login para o painel

---

### Bloco 2 — Core do Produto (5h)

**5ª e 6ª hora — Painel do Anfitrião**
- Painel com lista de páginas criadas
- Formulário para criar página: título, endereço, WhatsApp, tema
- Botão "Ver página" abre o guia do hóspede

**7ª e 8ª hora — Guia do Hóspede**
- Guia do hóspede funcionando visualmente
- Seções fixas com dados do banco: título, WhatsApp, tema
- Botão WhatsApp flutuante + QR Code

**9ª hora — Publicação**
- Endereço público `boasvindas.online/nomedoapartamento`
- Página 404 se endereço não existir
- Botão publicar/despublicar no painel

---

### Bloco 3 — Temas + Polimento (4h)

**10ª e 11ª hora — 2 Temas**
- Tema **Modern**: limpo, moderno, cores neutras
- Tema **Rustic**: tipografia clássica, paleta terra/madeira
- Preview do tema ao selecionar no painel

**12ª e 13ª hora — Visual do Painel**
- Painel com design profissional
- Card de cada página: nome, status, link, QR Code, botão editar
- Tela de edição básica: título, WhatsApp, tema

---

### Bloco 4 — Deploy Final + Margem de Segurança (3h)

**14ª hora — Deploy de Produção**
- Configurações finais do servidor
- Teste completo: cadastro → criar página → publicar → ver guia

**15ª e 16ª hora — Margem de Segurança**
- Reservado para imprevistos e ajustes
- Se sobrar tempo: terceiro tema (Glass)

---

# Tecnologias — boasvindas.online

> ⚡ = usado já no produto inicial (16h). O restante entra nas fases seguintes.

## Frontend + Backend

| Camada | Tecnologia | Para que serve |
|--------|-----------|----------------|
| Framework | ⚡ **Next.js 15** | Base de tudo — renderiza as landing pages e o painel do host |
| Linguagem | ⚡ **TypeScript** | Código mais seguro e com menos bugs |
| CSS | ⚡ **Tailwind CSS v4** | Estilização rápida e responsiva |
| Componentes | ⚡ **shadcn/ui** | Biblioteca de botões, tabelas, formulários prontos |
| Animações | **Framer Motion** | Transições suaves no editor |
| Estado | **Zustand** | Gerenciamento de estado do builder |
| Formulários | **React Hook Form + Zod** | Formulários validados no frontend e backend |
| Drag & Drop | **dnd-kit** | Arrastar e soltar seções no editor |
| Ícones | ⚡ **Lucide React** | Ícones consistentes (mesmo pacote do demo) |
| QR Code | ⚡ **qrcode.react** | Gera o QR Code de cada página |

## API (dentro do Next.js)

| Camada | Tecnologia | Para que serve |
|--------|-----------|----------------|
| API | ⚡ **Next.js Route Handlers** | API REST sem servidor separado |
| Banco | ⚡ **Drizzle ORM** | Comunicação com o banco de dados |
| Validação | ⚡ **Zod** | Valida dados no servidor |
| Autenticação | ⚡ **Auth.js v5** | Login, sessões, segurança |
| Upload | **@aws-sdk/client-s3** | Upload de fotos para o Backblaze B2 |

> ⚡ **MVP:** upload de fotos não entra nas 16h. Host usa links externos por enquanto.

| ⚡ **Neon (PostgreSQL)** | Armazena usuários, páginas, seções, fotos |

## Armazenamento de Fotos

| Serviço | Para que serve |
|---------|----------------|
| **Backblaze B2** | Armazena as fotos de cada landing page |
| **Cloudflare** | Entrega as fotos rapidamente para qualquer lugar do mundo |

<script type="text/markdown" id="md-arch">
# Como Funciona — boasvindas.online

> Esta seção explica a estrutura técnica do produto para referência futura.

---

## Visão Geral

O produto é um único site que faz três coisas ao mesmo tempo:

| Parte | URL | Para quem |
|-------|-----|-----------|
| Homepage de marketing | `boasvindas.online` | Visitantes e futuros clientes |
| Painel do host | `boasvindas.online/app` | Anfitriões cadastrados |
| Guia do hóspede | `boasvindas.online/nomedoapartamento` | Hóspedes |

Tudo roda num único deploy no **Netlify**. Sem servidor separado.

---

## Banco de Dados

O banco armazena quatro tipos de informação:

| Tabela | O que guarda |
|--------|-------------|
| **Usuários** | Email, senha, nome, plano |
| **Páginas** | Título, endereço, tema, fonte, WhatsApp, status (rascunho/publicado) |
| **Seções** | Cada bloco de conteúdo da página (apartamento, check-in, regras, etc.) |
| **Mídia** | URLs das fotos de cada página |

---

## Modelo de Monetização

### Avulso
| 1 página | R$ 19/mês |
|----------|-----------|
| Inclui | 7 temas, QR code, WhatsApp, seções completas, editor visual |

### Pacotes
| Pacote | Páginas | Preço | Economia |
|--------|---------|-------|----------|
| Duplex | 2 | R$ 29/mês | R$ 9 |
| Triplex | 3 | R$ 39/mês | R$ 18 |
| Quinteto | 5 | R$ 59/mês | R$ 36 |

### Planos
| Plano | Páginas | Preço | Diferencial |
|-------|---------|-------|-------------|
| Anfitrião Pro | até 10 | R$ 99/mês | Analytics + suporte prioritário |
| Gestor | ilimitadas | R$ 199/mês | Colaboração, white-label |

### Add-ons (por página/mês)

| Add-on | Preço | Domínio de quem | O que boasvindas.online faz |
|--------|-------|----------------|---------------------------|
| Subdomínio (`flatipe.boasvindas.online`) | +R$ 9 | De vocês | Configura DNS wildcard + roteamento |
| Domínio customizado (`flatipe.com.br`) | +R$ 15 | Do cliente | Aceita o domínio + provisiona SSL |
| Exportação PDF | +R$ 5 | — | Gera PDF imprimível sob demanda |
| Analytics avançado | +R$ 9 | — | Métricas detalhadas de visitas |

> **Sobre domínios:** nenhum dos dois add-ons exige comprar domínios.
> No subdomínio, o próprio domínio `boasvindas.online` é usado.
> No domínio customizado, o cliente já tem ou compra o domínio por conta própria.

---

## Como as Landing Pages são Entregues

Quando um hóspede acessa `boasvindas.online/flat-ipe`:

1. O Netlify verifica se a página está publicada
2. Se publicada: entrega um HTML já pronto (gerado e cacheado — carregamento instantâneo)
3. O HTML aplica o tema e as fontes escolhidas pelo host
4. A página é indexável pelo Google (SEO nativo)
